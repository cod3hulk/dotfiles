# Herdr configuration.  Runtime state, logs, and the socket stay under
# ~/.config/herdr and are intentionally not managed by chezmoi.

onboarding = false

[theme]
name = "dracula"

# Built-in dracula renders inactive tabs as overlay0 (#6272a4) on surface0
# (#44475a), a 1.9:1 contrast ratio that is effectively unreadable. Recess the
# inactive tab surface to Dracula's darker background and lift the label to the
# theme's own mid tone, which brings both inactive tab styles to 4.8:1 while the
# active tab keeps its accent purple.
[theme.custom]
surface0 = "#21222c"
overlay0 = "#828cb4"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
# Match tmux's prefix for muscle-memory compatibility.
prefix = "ctrl+a"

# Ctrl-Space opens herdr-which-key directly. Herdr's prefix remains Ctrl-A.
# Keep prefix+s available for the workspace/session picker instead of Herdr's
# default settings binding.
settings = "prefix+shift+s"
reload_config = "prefix+shift+r"

# Tmux-style navigation and tab/window operations. Herdr calls tmux windows
# tabs and tmux sessions workspaces.
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
# Reorder tabs, matching the previous tmux swap-window bindings
# (`bind-key < / > swap-window -d -t :-1 / :+1`).
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"
# Cmd+Shift+[ / ] are translated by Alacritty into prefix+p/n so these
# work reliably through the terminal input stream.
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# Tmux-style pane operations.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
rename_pane = "prefix+shift+p"
close_pane = "prefix+x"
split_horizontal = "prefix+minus"
# Match the previous tmux config: `prefix+|` splits side-by-side (vertical
# divider), `prefix+-` splits stacked (horizontal divider). `prefix+v` is now
# copy mode.
split_vertical = "prefix+|"
copy_mode = "prefix+v"
zoom = "prefix+z"
resize_mode = "prefix+r"
resize_pane_up = "prefix+shift+k"
resize_pane_down = "prefix+shift+j"
resize_pane_left = "prefix+shift+h"
resize_pane_right = "prefix+shift+l"

# Tmux session-management equivalents.
workspace_picker = "prefix+s"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
goto = "prefix+g"
detach = "prefix+d"
help = "prefix+?"

# herdr-which-key provides a searchable, grouped overlay based on the actual
# Herdr config, while prefix+? remains Herdr's built-in reference. The popup
# route is required so the overlay receives an interactive TTY.
[[keys.command]]
key = "ctrl+space"
type = "popup"
command = "sh ~/.config/herdr/plugins/config/cowboyvang.which-key/launch.sh"
description = "which-key: show prefix bindings"
width = "78%"
height = "62%"

# `prefix+shift+a` opens an interactive popup that prompts for an agent (pi or
# hermes) and a prompt, then creates a new tab, launches the agent, and submits
# the prompt. This is the Herdr-native equivalent of tmux's agent-new-window.sh:
# it is the one route with a real interactive TTY, so it is the only place a
# prompt can be captured. The no-prompt `prefix+a+n+(p|h)` variants live in the
# herdr-which-key overlay's agent group, which owns the `a` key; the shifted
# chord keeps the prompt shortcut in the agent family without shadowing that
# group, and the overlay's root table lists it automatically as a display-only
# `prefix+shift+a` row.
[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "sh ~/.config/herdr/scripts/agent-new-tab-prompt.sh"
description = "agent: new tab with prompt"
width = "50%"
height = "30%"

# herdr-pluck is the tmux-fingers/tmux-copycat equivalent: prefix+u labels every
# visible URL and opens the chosen one in the browser; prefix+t labels visible
# tokens (paths, SHAs, IPs, UUIDs, k8s refs, ...) and copies the chosen one.
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "rmarganti.herdr-pluck.open-url"
description = "pluck: open visible URL"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"
description = "pluck: copy visible token"

# Smart ctrl+h/j/k/l pane navigation, mirroring the tmux + vim-tmux-navigator
# setup: in a shell pane, ctrl+hjkl focuses the neighbouring herdr pane; in
# Neovim/Vim, the key is forwarded to the editor (herdr/scripts/navigate.sh
# checks the foreground process), so intra-nvim split navigation keeps working
# and nvim hands off to herdr at window edges (see nvim/lua/user/navigator.lua).
# These are `type = "shell"` so they run detached and can call the socket.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "sh ~/.config/herdr/scripts/navigate.sh left ctrl+h"
description = "focus pane left (smart)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "sh ~/.config/herdr/scripts/navigate.sh down ctrl+j"
description = "focus pane down (smart)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "sh ~/.config/herdr/scripts/navigate.sh up ctrl+k"
description = "focus pane up (smart)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "sh ~/.config/herdr/scripts/navigate.sh right ctrl+l"
description = "focus pane right (smart)"

# herdr-annotate: annotate terminal text and send feedback to the agent.
# The README defaults `prefix+shift+a` (copy-context) and `prefix+m` (manage);
# both are taken here (agent prompt popup; which-key pane-move group), so they
# are remapped to prefix+ctrl+shift+a and prefix+alt+m.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate: comment on selected text"

[[keys.command]]
key = "prefix+ctrl+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "annotate: copy annotations as context"

[[keys.command]]
key = "prefix+alt+m"
type = "plugin_action"
command = "annotate.manage"
description = "annotate: manage annotations"

# Document review (plannotator-tui).
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "annotate: review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "annotate: review the agent's last reply"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[ui]
tab_bar_position = "bottom"
pane_borders = true
pane_gaps = true
