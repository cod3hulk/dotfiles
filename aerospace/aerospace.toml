# AeroSpace tiling window manager config
# Replaces yabai + skhd with a single tool — no SIP disable required.
# Guide: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

# Start AeroSpace at login
start-at-login = false

# Auto-reload config on save (after one manual reload to activate)
auto-reload-config = true

# Normalizations — keep the tree clean
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout: tiles (BSP equivalent)
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Don't auto-unhide cmd-h hidden apps
automatically-unhide-macos-hidden-apps = false

# Keep all workspaces alive even when empty
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9',
                         'A', 'B', 'C', 'D', 'E', 'F']

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

# Gaps — mirrors yabai: 20px outer + 20px inner
gaps.inner.horizontal = 20
gaps.inner.vertical   = 20
gaps.outer.left       = 20
gaps.outer.bottom     = 20
gaps.outer.top        = 20
gaps.outer.right      = 20

# ── App routing rules ──────────────────────────────────────────────
# Mirrors the yabai rules: tile browser/Slack main windows, float aux/popup windows.
# Syntax: if = 'test %{app-bundle-id} = <bundle-id>' (optionally && test %{window-title} ~= <substring>)
#
# AeroSpace cannot position floating windows itself (`move`/`resize` reject them,
# see AeroSpace issue #9), so placement is delegated to the float-place helper.
# AeroSpace exports AEROSPACE_WINDOW_ID to exec-and-forget and the helper inherits
# AeroSpace's Accessibility permission, so it needs no grant of its own.
#
# --grid mirrors yabai's grid=<rows>:<cols>:<col>:<row>:<cols-wide>:<rows-high>.
# Add --gaps 20 to any invocation to inset placement by the outer gap.
#
# Only the first matching callback runs, so specific rules come first and the
# catch-all comes last. Rules that want placement invoke float-place themselves.

# Clawd floating avatar overlay — float where it is, never repositioned
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.clawd.on-desk'
run = 'layout floating'

# iStat Menus — float where it is, never repositioned
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.bjango.istatmenus'
run = 'layout floating'

# Zoom — only the main meeting window tiles
[[on-window-detected]]
if = 'test %{app-bundle-id} = us.zoom.xos && test %{window-title} ~= "Zoom Workplace"'
run = 'layout tiling'

[[on-window-detected]]
if = 'test %{app-bundle-id} = us.zoom.xos'
run = ['layout floating', 'exec-and-forget "$HOME/.dotfiles/aerospace/float-place"']

# Bitwarden browser extension popup (Brave) — centered third of the screen
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.brave.Browser && test %{window-title} ~= Bitwarden'
run = ['layout floating', 'exec-and-forget "$HOME/.dotfiles/aerospace/float-place" --grid 3:3:1:1:1:1']

# nvim-anywhere popup (Alacritty with fixed title) — centered two thirds
[[on-window-detected]]
if = 'test %{app-bundle-id} = org.alacritty && test %{window-title} ~= nvim-anywhere'
run = ['layout floating', 'exec-and-forget "$HOME/.dotfiles/aerospace/float-place" --grid 6:6:1:1:4:4']

# Everything else: if it ended up floating (dialogs, non-resizable popups, and
# anything AeroSpace declined to tile), center it at its own size. Deliberately
# no --grid here: yabai's `rule --apply app='.*' grid=8:8:1:1:6:6` only ran once
# at config load, so force-resizing every new popup to 75% would be new behaviour.
[[on-window-detected]]
if = 'true'
run = 'exec-and-forget "$HOME/.dotfiles/aerospace/float-place" --if-floating'

# ── Main mode keybindings ──────────────────────────────────────────
# Mirrors skhdrc mappings, adapted to AeroSpace command syntax

[mode.main.binding]

    # Layout toggles
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Focus — same as skhd: alt+hjkl
    # --ignore-floating: directional focus stays in the tiling tree; floating
    # windows are reached by clicking or alt-tab, as they were under yabai
    # --boundaries all-monitors-outer-frame: continue to next monitor at edge
    # --boundaries-action wrap-around-all-monitors: wrap from last monitor back to first
    alt-h = 'focus left --ignore-floating --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
    alt-j = 'focus down --ignore-floating --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
    alt-k = 'focus up --ignore-floating --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
    alt-l = 'focus right --ignore-floating --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'

    # Move window in tree — replaces skhd alt+shift+hjkl (yabai --warp)
    # h/l route through float-place so they also move *floating* windows to the
    # next/prev monitor (AeroSpace's `move` rejects floats, issue #9). Tiling
    # windows delegate to `aerospace move` with the same --boundaries flag as
    # before, so cross-monitor behaviour for tiles is unchanged. j/k stay native
    # since vertical monitor traversal isn't meaningful here.
    alt-shift-h = 'exec-and-forget "$HOME/.dotfiles/aerospace/float-place" --move-screen prev'
    alt-shift-l = 'exec-and-forget "$HOME/.dotfiles/aerospace/float-place" --move-screen next'
    alt-shift-j = 'move down --boundaries all-monitors-outer-frame'
    alt-shift-k = 'move up --boundaries all-monitors-outer-frame'

    # Toggle split orientation
    alt-shift-t = 'layout tiles horizontal vertical'

    # Focus next/prev window — replaces alt-n / alt-p
    alt-n = 'focus right --ignore-floating'
    alt-p = 'focus left --ignore-floating'

    # Resize — replaces alt+cmd+hjkl
    alt-cmd-h = 'resize width +50'
    alt-cmd-l = 'resize width -50'
    alt-cmd-k = 'resize height -50'
    alt-cmd-j = 'resize height +50'

    # Balance sizes — replaces alt+cmd+0 (yabai --balance)
    alt-cmd-0 = 'balance-sizes'

    # Fullscreen — replaces alt-f (yabai --toggle zoom-fullscreen)
    # Note: alt-f conflicts with workspace F, so workspace F is unbound.
    # Use alt-g for workspace F if needed.
    # Routed through float-place because `aerospace fullscreen` silently ignores
    # floating windows, leaving no way back out of one. Tiling windows are handed
    # straight back to AeroSpace; --gaps 20 matches the outer gap AeroSpace's own
    # fullscreen leaves.
    alt-f = 'exec-and-forget "$HOME/.dotfiles/aerospace/float-place" --fullscreen --gaps 20'

    # Toggle floating + center — Alt+Shift+F
    # Note: alt-shift-f conflicts with move-node-to-workspace F, so workspace F
    # is accessible via alt-g above instead.
    # float-place is a compiled Swift binary that handles the full toggle + place
    # cycle itself (no visual jump to corner before centering). The grid matches
    # the yabai default: 8x8 grid, offset 1:1, spanning 6x6 — centered at 75%.
    # Build: swiftc -O float-place.swift -o float-place (in aerospace/ dir)
    alt-shift-f = 'exec-and-forget "$HOME/.dotfiles/aerospace/float-place" --toggle --grid 8:8:1:1:6:6'

    # Close window — replaces alt-w (yabai --close)
    alt-w = 'close'

    # Minimize window — replaces alt-m (yabai --minimize)
    alt-m = 'macos-native-minimize'

    # Workspace switching — alt+number/letter
    # alt-f is taken by fullscreen; workspace F accessible via alt-g below
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-a = 'workspace A'
    alt-b = 'workspace B'
    alt-c = 'workspace C'
    alt-d = 'workspace D'
    alt-e = 'workspace E'
    alt-g = 'workspace F'

    # Move window to workspace — alt+shift+number/letter
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-b = 'move-node-to-workspace B'
    alt-shift-c = 'move-node-to-workspace C'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-e = 'move-node-to-workspace E'

    # Workspace back-and-forth
    alt-tab = 'workspace-back-and-forth'

    # Move workspace to next monitor — replaces shift+cmd+z (send to next space + follow)
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Enter service mode
    alt-shift-semicolon = 'mode service'

    # ── App launching with hyper key (cmd+ctrl+alt+shift) ────────────
    # Replaces skhd hyper bindings

    # Open default browser
    cmd-ctrl-alt-shift-b = '''exec-and-forget open -b "$(defaults read ~/Library/Preferences/com.apple.LaunchServices/com.apple.launchservices.secure LSHandlers | awk '/LSHandlerRoleAll/{gsub(/.*= "/,""); gsub(/".*$/,""); bundle=$0} /LSHandlerURLScheme = https;/{print bundle; exit}')"'''

    # Open Slack
    cmd-ctrl-alt-shift-s = '''exec-and-forget open '/Applications/Slack.app' '''

    # Open Alacritty (terminal)
    cmd-ctrl-alt-shift-t = '''exec-and-forget open '/Applications/Alacritty.app' '''

    # Open IntelliJ IDEA
    cmd-ctrl-alt-shift-i = '''exec-and-forget open '/Applications/IntelliJ IDEA.app' '''

    # Open Spotify
    cmd-ctrl-alt-shift-f1 = '''exec-and-forget open '/Applications/Spotify.app' '''

    # nvim-anywhere
    cmd-ctrl-alt-shift-v = '''exec-and-forget /Users/tomas.ave/Development/cod3hulk/nvim-anywhere/bin/nvim-anywhere'''

# ── Service mode (alt+shift+; to enter, esc to exit) ───────────────
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']    # reset layout
    f = ['exec-and-forget "$HOME/.dotfiles/aerospace/float-place" --toggle --grid 8:8:1:1:6:6', 'mode main']    # toggle floating + place (same as alt-shift-f in main mode)
    backspace = ['close-all-windows-but-current', 'mode main']

    # Re-apply on-window-detected rules to every window that is already open.
    # This is the equivalent of yabai's `rule --apply`, which ran against existing
    # windows at config load; AeroSpace only runs the rules on newly detected ones.
    p = ['exec-and-forget /opt/homebrew/bin/aerospace run-callback --for-every-window on-window-detected', 'mode main']

    # Join containers (merge adjacent tiles)
    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
