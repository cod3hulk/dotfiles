# AeroSpace tiling window manager config
# Replaces yabai + skhd with a single tool — no SIP disable required.
# Guide: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

# Start AeroSpace at login — ensures it launches before apps so every window
# is detected and managed. With `false`, windows opened before AeroSpace starts
# (e.g. Alacritty launched at login) are never captured and float unmanaged,
# which leaves alt-shift-f unable to toggle them back into the tiling tree.
start-at-login = true

# Auto-reload config on save (after one manual reload to activate)
auto-reload-config = true

# Normalizations — keep the tree clean
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout: tiles (BSP equivalent)
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Restore layouts and launch the SwiftBar workspace indicator at login.
# SketchyBar remains disabled. SwiftBar setup: ~/.dotfiles/swiftbar/README.md
after-startup-command = [
  'exec-and-forget /usr/bin/open -g -a SwiftBar',
  'exec-and-forget /opt/homebrew/bin/python3 /Users/tomas.ave/.dotfiles/aerospace/restore-layout.py'
]

# Keep Clawd's paired overlay windows on the newly focused workspace.
exec-on-workspace-change = ['/bin/bash', '-c',
  '/Users/tomas.ave/.dotfiles/aerospace/follow-clawd.sh'
]
on-focus-changed = []

# Don't auto-unhide cmd-h hidden apps
automatically-unhide-macos-hidden-apps = false

# Keep all workspaces alive even when empty
persistent-workspaces = ['1-💼-Work', '2-📅-Plan', '3-🤖-Agents', '4-🏡-Personal', '5-💬-Comms', '6', '7', '8', '9',
                         'A', 'B', 'C', 'D', 'E', 'F']

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

# Gaps — mirrors yabai: 20px outer + 20px inner
gaps.inner.horizontal = 20
gaps.inner.vertical   = 20
gaps.outer.left       = 20
gaps.outer.bottom     = 20
# Native menu bar only; no extra space reserved for SketchyBar.
gaps.outer.top        = 20
gaps.outer.right      = 20

# ── App routing rules ──────────────────────────────────────────────
# Mirrors the yabai rules: tile browser/Slack main windows, float aux/popup windows.
# Syntax: if = 'test %{app-bundle-id} = <bundle-id>' (optionally && test %{window-title} ~= <substring>)
#
# Only the first matching callback runs, so specific rules come first.

# Clawd floating avatar overlay — float where it is, never repositioned
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.clawd.on-desk'
run = 'layout floating'

# Zoom — only the main meeting window tiles
[[on-window-detected]]
if = 'test %{app-bundle-id} = us.zoom.xos && test %{window-title} ~= "Zoom Workplace"'
run = 'layout tiling'

[[on-window-detected]]
if = 'test %{app-bundle-id} = us.zoom.xos'
run = 'layout floating'

# Bitwarden browser extension popup (Brave)
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.brave.Browser && test %{window-title} ~= Bitwarden'
run = 'layout floating'

# nvim-anywhere popup (Alacritty with fixed title)
[[on-window-detected]]
if = 'test %{app-bundle-id} = org.alacritty && test %{window-title} ~= nvim-anywhere'
run = 'layout floating'

# Five-space app routing. Specific popup exceptions above take precedence.
# Exact split positions are rebuilt at startup or with Alt+Shift+R.
# 1 Work: Chrome + Obsidian; time tracker stays floating.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.google.Chrome'
run = 'move-node-to-workspace "1-💼-Work"; layout --workspace "1-💼-Work" --root tiles horizontal'

[[on-window-detected]]
if = 'test %{app-bundle-id} = md.obsidian'
run = 'move-node-to-workspace "1-💼-Work"; layout --workspace "1-💼-Work" --root tiles horizontal'

[[on-window-detected]]
if = 'test %{app-bundle-id} = mac.partl.workinghours'
run = 'move-node-to-workspace "1-💼-Work"; layout floating'

# 2 Plan: Gmail, Calendar (Safari web apps), Things.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Safari.WebApp.F0798CA9-2A28-4659-8C41-EADE3FF65417'
run = 'move-node-to-workspace "2-📅-Plan"; layout --workspace "2-📅-Plan" --root tiles horizontal'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Safari.WebApp.BD7B59DC-00BE-410C-8F8A-F994A0939955'
run = 'move-node-to-workspace "2-📅-Plan"; layout --workspace "2-📅-Plan" --root tiles horizontal'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.culturedcode.ThingsMac'
run = 'move-node-to-workspace "2-📅-Plan"; layout --workspace "2-📅-Plan" --root tiles horizontal'

# 3 Agents: Hermes, Pi Desktop, Ollama.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.nousresearch.hermes-bundled'
run = 'move-node-to-workspace "3-🤖-Agents"; layout --workspace "3-🤖-Agents" --root tiles horizontal'

[[on-window-detected]]
if = 'test %{app-bundle-id} = dev.pi.desktop-gui'
run = 'move-node-to-workspace "3-🤖-Agents"; layout --workspace "3-🤖-Agents" --root tiles horizontal'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.electron.ollama'
run = 'layout tiling; move-node-to-workspace "3-🤖-Agents"; layout --workspace "3-🤖-Agents" --root tiles horizontal'

# 4 Personal: Brave, messaging, music, bookmarks. No separate research space.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.brave.Browser'
run = 'move-node-to-workspace "4-🏡-Personal"; layout --workspace "4-🏡-Personal" --root tiles horizontal'

[[on-window-detected]]
if = 'test %{app-bundle-id} = net.whatsapp.WhatsApp'
run = 'move-node-to-workspace "4-🏡-Personal"; layout --workspace "4-🏡-Personal" --root tiles horizontal'

[[on-window-detected]]
if = 'test %{app-bundle-id} = ru.keepcoder.Telegram'
run = 'move-node-to-workspace "4-🏡-Personal"; layout --workspace "4-🏡-Personal" --root tiles horizontal'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.spotify.client'
run = 'move-node-to-workspace "4-🏡-Personal"; layout --workspace "4-🏡-Personal" --root tiles horizontal'

[[on-window-detected]]
if = 'test %{app-bundle-id} = io.raindrop.macapp'
run = 'move-node-to-workspace "4-🏡-Personal"; layout --workspace "4-🏡-Personal" --root tiles horizontal'

# 5 Comms: Slack on the laptop display.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace "5-💬-Comms"; layout --workspace "5-💬-Comms" --root tiles horizontal'

# ── Main mode keybindings ──────────────────────────────────────────
# Mirrors skhdrc mappings, adapted to AeroSpace command syntax

[mode.main.binding]

    # Layout toggles
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Restore app destinations and the exact Work/Plan splits without launching apps.
    alt-shift-r = 'exec-and-forget /opt/homebrew/bin/python3 /Users/tomas.ave/.dotfiles/aerospace/restore-layout.py'

    # Focus — same as skhd: alt+hjkl
    # --ignore-floating: directional focus stays in the tiling tree; floating
    # windows are reached by clicking or alt-tab, as they were under yabai
    # --boundaries all-monitors-outer-frame: continue to next monitor at edge
    # --boundaries-action wrap-around-all-monitors: wrap from last monitor back to first
    alt-h = 'focus left --ignore-floating --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
    alt-j = 'focus down --ignore-floating --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
    alt-k = 'focus up --ignore-floating --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
    alt-l = 'focus right --ignore-floating --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'

    # Move window in tree — replaces skhd alt+shift+hjkl (yabai --warp)
    alt-shift-h = 'move left --boundaries all-monitors-outer-frame'
    alt-shift-l = 'move right --boundaries all-monitors-outer-frame'
    alt-shift-j = 'move down --boundaries all-monitors-outer-frame'
    alt-shift-k = 'move up --boundaries all-monitors-outer-frame'

    # Toggle split orientation
    alt-shift-t = 'layout tiles horizontal vertical'

    # Focus next/prev window — replaces alt-n / alt-p
    alt-n = 'focus right --ignore-floating'
    alt-p = 'focus left --ignore-floating'

    # Resize — replaces alt+cmd+hjkl
    alt-cmd-h = 'resize width +50'
    alt-cmd-l = 'resize width -50'
    alt-cmd-k = 'resize height -50'
    alt-cmd-j = 'resize height +50'

    # Balance sizes — replaces alt+cmd+0 (yabai --balance)
    alt-cmd-0 = 'balance-sizes'

    # Fullscreen — replaces alt-f (yabai --toggle zoom-fullscreen)
    # Note: alt-f conflicts with workspace F, so workspace F is unbound.
    # Use alt-g for workspace F if needed.
    alt-f = 'fullscreen'

    # Toggle floating/tiling — Alt+Shift+F
    # Note: alt-shift-f conflicts with move-node-to-workspace F, so workspace F
    # is accessible via alt-g above instead.
    alt-shift-f = 'layout floating tiling'

    # Close window — replaces alt-w (yabai --close)
    alt-w = 'close'

    # Minimize window — replaces alt-m (yabai --minimize)
    alt-m = 'macos-native-minimize'

    # Workspace switching — alt+number/letter
    # alt-f is taken by fullscreen; workspace F accessible via alt-g below
    alt-1 = 'workspace "1-💼-Work"'
    alt-2 = 'workspace "2-📅-Plan"'
    alt-3 = 'workspace "3-🤖-Agents"'
    alt-4 = 'workspace "4-🏡-Personal"'
    alt-5 = 'workspace "5-💬-Comms"'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-a = 'workspace A'
    alt-b = 'workspace B'
    alt-c = 'workspace C'
    alt-d = 'workspace D'
    alt-e = 'workspace E'
    alt-g = 'workspace F'

    # Move window to workspace — alt+shift+number/letter
    alt-shift-1 = 'move-node-to-workspace "1-💼-Work"'
    alt-shift-2 = 'move-node-to-workspace "2-📅-Plan"'
    alt-shift-3 = 'move-node-to-workspace "3-🤖-Agents"'
    alt-shift-4 = 'move-node-to-workspace "4-🏡-Personal"'
    alt-shift-5 = 'move-node-to-workspace "5-💬-Comms"'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-b = 'move-node-to-workspace B'
    alt-shift-c = 'move-node-to-workspace C'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-e = 'move-node-to-workspace E'

    # Workspace back-and-forth
    alt-tab = 'workspace-back-and-forth'

    # Move workspace to next monitor — replaces shift+cmd+z (send to next space + follow)
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Enter service mode
    alt-shift-semicolon = 'mode service'

    # ── App launching with hyper key (cmd+ctrl+alt+shift) ────────────
    # Replaces skhd hyper bindings

    # Open default browser
    cmd-ctrl-alt-shift-b = '''exec-and-forget open -b "$(defaults read ~/Library/Preferences/com.apple.LaunchServices/com.apple.launchservices.secure LSHandlers | awk '/LSHandlerRoleAll/{gsub(/.*= "/,""); gsub(/".*$/,""); bundle=$0} /LSHandlerURLScheme = https;/{print bundle; exit}')"'''

    # Launch or focus Hermes
    cmd-ctrl-alt-shift-h = 'exec-and-forget open -b com.nousresearch.hermes-bundled'

    # Open Slack
    cmd-ctrl-alt-shift-s = '''exec-and-forget open '/Applications/Slack.app' '''

    # Open Alacritty (terminal)
    cmd-ctrl-alt-shift-t = '''exec-and-forget open '/Applications/Alacritty.app' '''

    # Open IntelliJ IDEA
    cmd-ctrl-alt-shift-i = '''exec-and-forget open '/Applications/IntelliJ IDEA.app' '''

    # Open Spotify
    cmd-ctrl-alt-shift-f1 = '''exec-and-forget open '/Applications/Spotify.app' '''

    # nvim-anywhere
    cmd-ctrl-alt-shift-v = '''exec-and-forget /Users/tomas.ave/Development/cod3hulk/nvim-anywhere/bin/nvim-anywhere'''

# ── Service mode (alt+shift+; to enter, esc to exit) ───────────────
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']    # reset layout
    f = ['layout floating tiling', 'mode main']    # toggle floating/tiling (same as alt-shift-f in main mode)
    backspace = ['close-all-windows-but-current', 'mode main']

    # Re-apply on-window-detected rules to every window that is already open.
    # This is the equivalent of yabai's `rule --apply`, which ran against existing
    # windows at config load; AeroSpace only runs the rules on newly detected ones.
    p = ['exec-and-forget /opt/homebrew/bin/aerospace run-callback --for-every-window on-window-detected', 'mode main']

    # Join containers (merge adjacent tiles)
    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# Match display names, not unstable monitor sequence numbers.
# Fall back to the laptop when the LG is disconnected.
[workspace-to-monitor-force-assignment]
    "1-💼-Work" = ['LG HDR WQHD', 'built-in']
    "2-📅-Plan" = ['LG HDR WQHD', 'built-in']
    "3-🤖-Agents" = ['LG HDR WQHD', 'built-in']
    "4-🏡-Personal" = ['LG HDR WQHD', 'built-in']
    "5-💬-Comms" = 'built-in'
